# systemd drop-in：装到 77 的
#   /etc/systemd/system/wg-quick@wg2.service.d/after-docker.conf
#
# 🚨 为什么需要它：wg2.conf 的 PostUp 里有一条 `iptables -I DOCKER-USER ...`，
#    而 **`DOCKER-USER` 链是 docker 启动时创建的**。开机时若 wg2 先于 docker 起来，
#    那条 `-I DOCKER-USER` 会因为链不存在而失败 —— wg-quick 会让整个接口起不来，
#    连带 nvy-guest-proxy（Requires=wg-quick@wg2）也起不来。
#
# ⚠️ **只给 wg2 加**（`wg-quick@wg2.service.d/`），不影响 wg0 / wg1 —— 那两条没有
#    docker 相关的 PostUp，凭空给它们加 docker 依赖会拖慢开机、且毫无收益。
#
# 装法：
#   mkdir -p /etc/systemd/system/wg-quick@wg2.service.d
#   install -m 0644 wg-quick-wg2-after-docker.conf \
#     /etc/systemd/system/wg-quick@wg2.service.d/after-docker.conf
#   systemctl daemon-reload

[Unit]
After=docker.service
Wants=docker.service
