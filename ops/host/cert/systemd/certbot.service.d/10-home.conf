# certbot.service drop-in —— 给 certbot 的 renewal hook 补一个 HOME。
#
# 为什么需要：certbot.service 是发行版自带的 **systemd 系统服务**，而 systemd 只在单元声明
# 了 User= 时才注入 HOME/USER/LOGNAME。以 root 跑的系统服务拿到的环境里**根本没有 HOME**，
# 于是 hook 里 `~` 展开成 `/`：
#     aliyun CLI  → stat /.aliyun/config.json  → "unknown profile shintong-dns"
#     ossutil     → 同理                       → "SigningContext.Credentials is null or empty"
# DNS-01 的 TXT 因此从没写成，LE 侧看到的是 NXDOMAIN。
#
# 🚨 这个洞为什么装机自检抓不到：runbook 教的验证命令是 `sudo certbot renew --dry-run`，而
#    sudo 在 env_reset 下会把 HOME 设成目标用户的家目录 —— **恰好就是生产路径缺的那个变量**。
#    人工验证路径与 certbot.timer 生产路径的环境不同，前者恒过、后者恒败。验证纪律见
#    docs/private/runbook/cert-management.md §5。
#
# 与 hook 内 `export HOME="${HOME:-/root}"` 是有意的双保险：drop-in 覆盖当前及未来所有 hook
# （含 renewal-hooks/deploy/ 下后加的），hook 内那行保证脚本换个调用方也能自足。
#
# 落点：/etc/systemd/system/certbot.service.d/10-home.conf（不改发行版的
# /usr/lib/systemd/system/certbot.service，drop-in 可跨 apt 升级存活）。
[Service]
Environment=HOME=/root
