name: CI

# Per ADR-0040 multi-layer test gate (PR-T3 / 门禁层): nx-server-specific
# build/test/lint jobs移到 pr-validation.yml 的 `validate-and-test` mega-job
# (跑 `nx affected -t lint typecheck test build runtime-smoke`). This file
# keeps only the workflow-level gates that operate outside nx (gitleaks scans
# commit history, actionlint validates GH workflow YAML, pr-title validates
# PR metadata, docker-image scans the built image on push-to-main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 🚨 `edited` 不是可选项，它是这个 workflow **唯一的自愈路径**（2026-08-19 #112 实证）：
    # 该 PR 的 CI run 被 GitHub 创建后一直卡在 `queued`，而 `gh run cancel` 返 HTTP 500、
    # `gh run rerun` 返 `cannot be rerun; This workflow is already running` —— 两条常规出路
    # 全断，7 个 required check 停在「Expected — Waiting for status to be reported」⇒ PR
    # 永久 BLOCKED。同一时刻 `pr-validation.yml` 同样被卡，但它配了 `edited`，release-please
    # 一改 body 就自动重跑爬起来了；本文件没配，只能靠人 `gh pr close` + `gh pr reopen`
    # （而 reopen 会清掉 auto-merge，得再 arm 一次）。
    # ⚠️ 顺带：改 PR 标题后 `PR title (conventional commits)` 那道闸本就该重跑，`edited` 一并修了。
    types: [opened, synchronize, reopened, edited]

# 🚨 与上面的 `edited` **成对出现，不可只加一半**：release-please 更新 Release PR 时会在
# **同一秒**触发 `synchronize` + `edited` 两个事件，两轮形状相同。key 末尾的
# `github.event.action` 把它们拆成两道、各自跑完 —— 不拆则互相取消，且取消掉哪一轮是
# race，掐中后创建的那轮会让最新 check suite 停在 `cancelled`、PR 永久 `BLOCKED`
# （2026-08-31 #304 实证，完整推导见 `pr-validation.yml` 同名段）。
# push→main 上 `github.event.action` 为空，key 退化成 `CI-<sha>-`，仍每次自成一组。
#
# 🚨 group key 里的 `|| github.sha` **不能省**：本 workflow 还跑在 `push: main` 上，那里
# `github.event.pull_request` 为 null —— 直接抄 pr-validation 的 key 会让**所有 main push
# 落进同一个组互相取消**，即「合入 B 把 A 那轮 CI 掐掉」，而 main 上的绿是发版前的最后一道
# 存证。用 sha 兜底后每次 push 自成一组，cancel-in-progress 只在同一个 PR 内生效。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 🚨 刻意**不用** `gitleaks/gitleaks-action@v2`,它有两个对公开仓致命的性质:
      #  ① **只扫本次事件的 commit**(diff-only)。仓已公开 = 机器人对抗性扫描,要的是全史。
      #  ② **自带 gitleaks 版本,且与本机不同**(action 里是 8.24.3,dev 机是 8.30.1),
      #     而豁免语法在版本间有差异 —— 2026-08-09 实证:`.gitleaks.toml` 的全局豁免
      #     写成复数 `[[allowlists]]` 时 8.24.3 **静默整块忽略**(不报错不警告),于是
      #     本机验证通过的配置在 CI 上等于零豁免,首个 commit 直接红 30 条假阳性。
      # 自己钉版本 ⇒ 本机与 CI 是同一个二进制,「本机验过」才等于「CI 也这样」。
      # 改这里的版本号时,先在新版本上跑一遍 .gitleaks.toml 的正例与负控制。
      - name: Install gitleaks (pinned — must match the version used to validate .gitleaks.toml)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL --retry 3 --retry-delay 5 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # 无 --log-opts = 扫全部历史(不是 diff-only)。--exit-code=1 让命中即红。
      - name: Scan full history
        run: |
          /tmp/gitleaks detect --source . --redact -v \
            --report-format=sarif --report-path=gitleaks.sarif --exit-code=1

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  actionlint:
    name: Actionlint (workflow YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    name: Markdownlint (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: .markdownlint-cli2.jsonc
          globs: '**/*.md'

  commitlint:
    name: Commitlint (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # 同 gitleaks:action 走 getPullRequestEventCommits 列 PR commits,需 PR 读权限。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # Per 05-22-mono-meta-frontend-gap-audit.md A1: Trivy fs scan covers the
  # source tree + pnpm transitive deps for both apps (server + mobile) +
  # packages/* — complementary to docker-image's base-image scan (caught on
  # main push only). fs scan runs PR + push so dep-tree CVE land in the
  # pre-merge gate. skip-dirs excludes generated artifacts and docs/.claude
  # to keep signal-to-noise high; ignore-unfixed mirrors image scan
  # (unfixed Expo / RN ecosystem CVE block PRs forever otherwise).
  trivy-fs:
    name: Trivy fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,.claude,packages/api-client/src/generated,apps/mobile/dist,apps/server/dist,node_modules'

  # V9 acceptance gate (Plan 1 § E.3): Docker build + Trivy image scan.
  # Trigger strategy: PR skip / main push run.
  # Rationale: image scan ~3-5min, no PR-time value (Dockerfile rarely changes
  # per PR; native deps caught by pr-validation runtime-smoke). main push
  # catches base-image / transitive CVE on the merged commit within revert
  # window. Not in ruleset required_status_checks. nightly cron is follow-up.
  docker-image:
    name: Docker build + Trivy image scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: nvy/server:ci
          platforms: linux/amd64
          cache-from: type=gha
          # 🚨 `runner` stage **不吃缓存** —— 它含 `RUN apk upgrade --no-cache`，而那条指令的
          # 字符串永远不变 ⇒ 配上 `cache-from` 后 BuildKit 每次都判 `CACHED`、**根本不执行**，
          # 于是镜像的系统补丁水平被冻在「这一层第一次构建那天」。
          # 2026-08-27 实证：`CVE-2026-14456`(HIGH, openssl DoS) 在 main 上连红两轮，
          # 构建日志里 `#25 [runner 3/10] RUN apk upgrade --no-cache` → `#25 CACHED`；
          # 镜像里是 `libcrypto3 3.5.7-r0` —— 既不是 base 出厂的 3.5.6-r0、也不是当前的
          # 3.5.8-r0，正是上一次该层真正执行那天的版本指纹。
          # ⇒ 这是**静默退化**：措施还在 Dockerfile 里写着，但已经很久没生效了。
          # `runner` 只有 apk + 几个 COPY/chmod，重建代价是秒级；builder stage 照旧吃缓存。
          no-cache-filters: runner
          # 🚨 `mode=max` 会把**每一个中间层**都写进 Actions 缓存，且每次 main 推送产生新一代。
          # 2026-08-02 实测：仓库 Actions 缓存 **11.17 GB / 上限 10 GB**、180 个条目，绝大多数是
          # 本步产生的 `buildkit-blob-*`（单个 261MB/237MB/131MB…）。超限后 GitHub 按 LRU 驱逐，
          # 把**真正影响合并时长的**缓存（Playwright / pnpm store）挤掉 —— 而本 job 只在 push→main
          # 跑、且**不是 required check**，用整个仓的缓存预算去换它的构建速度是亏的。
          # `mode=min` 只缓存最终镜像层，够 Trivy 扫描复用，体积小一个量级。
          cache-to: type=gha,mode=min

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nvy/server:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  futu-shim:
    name: futu-shim (pytest)
    runs-on: ubuntu-latest
    # 🚨 为什么这个 job 存在: `services/futu-shim/` 是**独立 python service**, 不在 Nx graph
    # 内 ⇒ `validate-and-test` 的 `nx affected` 永远看不见它。此前它的 44 项 pytest 只在
    # 本机 / 港机手动跑, 没有任何自动闸 —— 2026-08-01 那次限频配错 (history_kline 挂在最严
    # 兜底且逐页计数, 导致 prod 回填 ok=2/fail=5) 正是这类回归, 当时 CI 一声不吭。
    #
    # **恒定跑, 靠内部 path filter 决定要不要装依赖** (不用 workflow 级 `paths:`):
    # 那样在不相关 PR 上该 check 根本不上报, 一旦被加进 ruleset required checks 就会永远
    # pending 挡住 auto-merge (仓内 auto-merge 依赖 required checks, 见 github-ruleset.md)。
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Did futu-shim change?
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # 拿不到 base(首个 push / force-push 后 before=0000…) → 保守当作"变了", 跑全套。
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "base 不可用 → 保守全跑"; exit 0
          fi
          # 🚨 先取值再判空, **不要**写成 `git diff | grep -q .` 塞进 `if`: 那样 git 自身
          # 出错(坏 SHA / 浅克隆)会被 `if` 吞成"没改动"→ 静默跳过测试, 是"沉默=健康"反模式。
          # 这里 git 失败 → `set -e` 直接把 job 打红。
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- services/futu-shim/ .github/workflows/ci.yml)"
          if [ -n "$changed" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"; printf 'futu-shim 有改动 → 跑\n%s\n' "$changed"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"; echo "futu-shim 未改动 → 跳过测试步骤(本 job 仍报绿)"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.value == 'true'
        with:
          # 与港机对齐 (Ubuntu 24.04 默认 3.12.3)。别用 runner 默认版本 —— futu-api 在
          # 3.14 上要源码编译 pandas/numpy, 本机实测装到超时。
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/futu-shim/requirements.txt
            services/futu-shim/requirements-dev.txt

      - name: Install deps
        if: steps.changed.outputs.value == 'true'
        working-directory: services/futu-shim
        run: pip install -r requirements-dev.txt

      - name: pytest
        if: steps.changed.outputs.value == 'true'
        working-directory: services/futu-shim
        run: python -m pytest -q
