name: PR Validation

# Per ADR-0040 multi-layer test gate (PR-T3 / 门禁层 / 云端主防线).
#
# 2026-08-02 P4.2：原来是**单个 mega-job** `validate-and-test`，19m14s，其中
# `server:test` 占 91%、且与 mobile 的重任务（Metro 打包 ×2 + 141 个 Playwright）
# **在同一个 runner 上抢 CPU 与 Docker** —— 这不只是慢，它让 PR 门的绿灯带噪声：
# 一次红既可能是真 bug、也可能是资源竞争，人当场分不出，于是理性反应变成「先重跑
# 一次看看」，而重跑一次是 19 分钟（plan §一 有当日实证：affected 那轮 server:test
# 红，单独重跑 360 文件 / 3194 用例全过）。
#
# 现在拆成四个并行 job，server 与 mobile 落到**不同 runner**，同时解决慢与假红：
#
#   gate-checks     ─┐  治理全扫 + PR checkbox（最便宜，fail-fast 排最前）
#   lint-typecheck  ─┤
#   server-test     ─┼──> validate-and-test（聚合门）
#   mobile-checks   ─┘
#
# 🚨 **`validate-and-test` 这个名字不能改**：它是 ruleset `main-protection`
# (id 16500378) `required_status_checks` 里列的 context。保留一个同名聚合 job，
# 是为了让**以后再怎么拆 job / 加分片都不必再动 ruleset** —— 改 ruleset 是本仓
# 唯一不可逆的操作（contexts 与 job 名绑定，漏改则之后所有 PR 永久等一个永不出现
# 的 check）。SoT: docs/conventions/github-ruleset.md。
#
# `types: [..., edited]` lets `gh pr edit --body` wake a fresh run so
# author can recover from a body regression without close+reopen dance.
# Trade-off: title / body / any PR-field edit triggers full pipeline.
# DO NOT skip heavy steps on `edited` events via
# `if: github.event.action != 'edited'` — branch protection takes the
# latest check run for the head SHA, so a green `edited` run would
# silently overwrite a red `synchronize` run and let bad code merge.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# 同一个 PR 只保留最新一轮；旧的立刻取消。
# 🚨 不加这段的实测代价（2026-08-02）：release-please 机器人更新 Release PR 时会在**同一秒**
# 触发两个事件，两轮各自跑满 —— `19m20s + 20m09s`、`18m26s + 14m52s`，每天两次，
# 白烧约 39 分钟 runner 时间。上面「不要在 edited 上跳过重步骤」的告诫依然成立：
# 这里取消的是**同一 head ref 的旧运行**，最新一轮仍是完整跑，分支保护取的也是它。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── 层 1：最便宜的先跑（fail-fast）。全扫式治理不变量 + PR body 硬门，无 nx、无浏览器。
  gate-checks:
    name: gate-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # migration immutability 与 contract-smoke drift 都要 `git diff origin/main...HEAD`
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Enforce PR Checkboxes
        uses: actions/github-script@v7
        with:
          script: |
            // LIVE fetch — `context.payload.pull_request.body` is the
            // webhook snapshot frozen at trigger time. `gh pr edit` does
            // not update it, and `gh run rerun` reuses the same stored
            // payload, so a body-fix → rerun loop never escapes red.
            // Always fetch the current PR resource so edit-then-rerun
            // (or the `edited` trigger) reads the latest body.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            // Bypass: release-please bot's Release PRs (label prefix
            // `autorelease: pending`) carry auto-generated CHANGELOG
            // bodies — no deploy gate section by design (per ADR-0042).
            // They're pure version-bump PRs, no code change requires
            // smoke test verification. Enforcing the gate would BLOCK
            // them permanently. Label-based detection is reliable across
            // token modes (GITHUB_TOKEN bot author vs PAT-as-user author).
            // prefix match (not exact) because the 双 manifest split labels
            // per-component: `autorelease: pending: server` / `: mobile`.
            const labels = (pr.labels || []).map(l => l.name);
            if (labels.some(l => l.startsWith('autorelease: pending'))) {
              core.info('⏭ Skipped: release-please Release PR (autorelease: pending* label).');
              return;
            }
            const body = pr.body || '';
            // Match `### 🚨 部署与存活前置确认` header and consume until
            // the next `## ` (H2) or `### ` (H3) header, or EOF.
            // `###?` = 2 or 3 hashes; `\n.*\s` boundary prevents matching
            // `##` mid-line. Critical: matching `## ` is required because
            // `## Test plan` immediately follows the gate section in the
            // template — without H2 boundary, Test plan `- [ ]` entries
            // (post-merge follow-ups) would false-fail the gate.
            const checklistRegex = /### 🚨 部署与存活前置确认[\s\S]*?(?=\n###?\s|$)/;
            const match = body.match(checklistRegex);
            if (!match) {
              core.setFailed('🚨 拦截成功：未找到 `### 🚨 部署与存活前置确认` 区块。PR body 可能被 Claude Code 默认 HEREDOC 覆盖,请从 .github/pull_request_template.md 拷贝完整 section（详见 docs/conventions/pr-creation-protocol.md）。');
              return;
            }
            if (match[0].includes('- [ ]')) {
              core.setFailed('🚨 拦截成功：`### 🚨 部署与存活前置确认` 区域含未勾选项,本地物理验证通过后再勾全部 checkbox。');
              return;
            }
            core.info('✅ All deployment & smoke gate checkboxes ticked (live body fetch).');

      - name: Enforce migration immutability (per ADR-0035 + .claude/rules/migration-rules.md)
        # Per ADR-0035 § 1 + .claude/rules/migration-rules.md § 1 — 已合 main migration
        # is immutable; fix via new migration not modify existing. lefthook
        # migration-naming-check only catches diff-filter=A (new); this CI step
        # catches diff-filter=MD (modified/deleted), complementary.
        # Requires fetch-depth: 0 (already set in actions/checkout above).
        #
        # THREE-dot `origin/main...HEAD` (= merge-base(origin/main,HEAD)..HEAD),
        # NOT two-dot `origin/main`. Two-dot diffs against the LIVE origin/main
        # tip, so a PR that merely sits BEHIND main after a new migration lands
        # there sees that migration as D(eleted) → false-positive immutability
        # violation (bit stale release-please PR #647, 2026-07-14). Three-dot
        # diffs from the merge base — only what THIS branch changed since it
        # forked: main's independent new migrations are invisible, while a real
        # modify/delete BY the branch is still caught (verified both directions).
        # Do NOT revert to two-dot.
        run: |
          modified=$(git diff origin/main...HEAD --diff-filter=MD --name-only \
            | grep -E '^apps/server/prisma/migrations/[^/]+/migration\.sql$' \
            || true)
          if [ -n "$modified" ]; then
            echo "❌ Migration immutability violation: existing migration(s) modified/deleted vs origin/main"
            # Use awk instead of `sed 's/^/  - /'` per shellcheck SC2001 +
            # actionlint. awk handles per-line prefix without invoking sed regex.
            echo "$modified" | awk '{print "  - " $0}'
            echo ""
            echo "Per ADR-0035 § 1 + .claude/rules/migration-rules.md § 1 — 已合 main migration 禁修改；纠正以 new migration 实现。"
            exit 1
          fi
          echo "✅ No prisma migration immutability violation."

      - name: Enforce server bounded-context moat (per Plan 05-24 R-6 / ADR-0043 §5 + ADR-0034 Stage C)
        # ts-morph AST 探针, 机器强制两条 boundaries-ESLint 看不见的边界:
        #   1. 跨 bounded context 的 Prisma model 访问 (写禁 / 读需 // CROSS-CONTEXT-READ);
        #   2. 跨业务 ctx 构造器注入参数需 // CROSS-CONTEXT-{SYNC,ASYNC,READ} 注释。
        # lefthook server-moat-check 的云端镜像 (--no-verify 绕不过这里)。Full-scan,
        # 不依赖 nx affected — 护城河是 holistic invariant。
        run: pnpm tsx scripts/checks/check-server-moat.ts

      - name: Enforce nullable @ApiProperty explicit type (per orval objectmap regression 012/023/024/025)
        # nullable 标量 DTO 字段 (string|null / number|null / boolean|null) 的
        # @ApiProperty(Optional) 必须显式 type:, 否则 @nestjs/swagger 反射推不出标量 →
        # openapi.json schema 退化 → orval 生成 { [k]: unknown } | null (mobile 消费才暴露)。
        # lefthook api-property-nullable-check 的云端镜像 (--no-verify 绕不过这里)。Full-scan,
        # 不依赖 nx affected — 契约是 holistic invariant。
        run: pnpm tsx scripts/checks/check-api-property-nullable.ts

      - name: Enforce e2e seed-auth backend boundary (per 05-29-e2e-backend-boundary-hardening P1)
        # Every seed-authed Expo Web e2e spec (addInitScript + nvy-auth) MUST
        # intercept GET /me (mockJson GET stub or raw page.route on /me), else
        # boot useMe leaks to a real :3000 → env-dependent flake (profile.spec.ts
        # was the named regression). lefthook e2e-seed-auth-mock-check 的云端镜像
        # (--no-verify 绕不过这里). Full-scan, not nx affected — hermeticity is a
        # holistic invariant.
        run: pnpm tsx scripts/checks/check-e2e-seed-auth-mock.ts

      - name: Enforce commit messages parse under release-please's grammar
        # 🚨 与 ci.yml 的 Commitlint job **不是重复**：两者用不同解析器。commitlint 走
        # `conventional-commits-parser`(正则,只看 header);release-please 走
        # `@conventional-commits/parser`(PEG,过整条 message)。后者解析失败 → 整条 commit
        # 被**静默丢弃** → 不起 Release PR → 版本号与 CHANGELOG 双双失真,而 workflow 全绿。
        # 实证(2026-08-08 全史扫描):main 上 14 条 message 过了 commitlint 却过不了
        # release-please,其中 3 条 feature 已真的丢过版(003 refresh-token / 011 portfolio /
        # 028 chat),第 4 条 cbc66a3f(047 M2b)是本闸门的直接起因。
        #
        # 扫 PR 自己的 commit(`origin/main..HEAD`,需 fetch-depth: 0,上面已设)——GitHub 的
        # squash body 正是由这些 message 拼成,逐条拦住即等于拦住 squash 结果。`--no-merges`:
        # merge commit 不进 squash body,且其 message 本就不是 conventional 格式。
        # lefthook release-please-parseable 的云端镜像(`--no-verify` 绕不过这里)。
        run: pnpm tsx scripts/checks/check-commit-msg-parseable.ts --range origin/main..HEAD

      - name: Enforce test size taxonomy (per docs/conventions/testing.md)
        # apps/server/src/ 下起 Testcontainers 的 spec 必须叫 `*.it.spec.ts` —— vitest.config.ts
        # 就是按这个后缀分 `unit` / `it` 两个 project, 只有 `it` 挂共享 PG globalSetup。名字不带
        # `.it.` 的容器 spec 会同时坏两件事: ① 落在 `unit` 里, 拿不到共享 PG, 仍按文件各起容器 +
        # 各跑一遍 migrate deploy (P4 整轮重构要消灭的就是它) ② 让 `unit` 这条「不依赖 Docker 的
        # 快速内环」名不副实。退化 100% 静默 (新 spec 照样绿, 只是慢), 2026-05 ADR-0040 记下 T-1
        # 到 2026-08 攒了 46 个就是这么来的 ⇒ 必须机器卡。lefthook 无对应本地 hook, 本步是唯一硬门。
        # Full-scan, 不依赖 nx affected — 命名不变量是 holistic invariant。
        run: pnpm tsx scripts/checks/check-test-size.ts

      - name: Enforce prod graceful shutdown wiring (per #824)
        # apps/server/src/main.ts 必须在 listen() 前调 app.enableShutdownHooks()。
        # NestJS 官方: 关停钩子只在 app.close() 或 (SIGTERM + enableShutdownHooks) 时触发 ——
        # 少这一行, prod 收到 SIGTERM 时 BullMQ Worker 不会 close(), in-flight job 直接变
        # stalled, 而本仓是单实例部署没有第二个 worker 接管。缺失 100% 静默 (服务照常起、
        # 健康检查照常绿, 只在部署/重启那一刻悄悄丢 job), 实际缺了几个月没人发现 ⇒ 机器守。
        # 行为侧由 test/integration/queue-shutdown-order.it.spec.ts 覆盖 (证 close() 真会等)。
        run: pnpm tsx scripts/checks/check-shutdown-hooks.ts

      - name: Enforce optionsdesk rule constants live only in anchor.rules.ts (SC-005)
        # 档位系数 (愿买 / 四区间上下界 / 长持愿卖) 是**可调策略参数**, 不是数学常数。
        # 任何一处把 0.8 / 0.6 / 1.2 抄进代码, 调参时就会漏改那一处 —— 而漏改是静默的:
        # 类型对、测试绿, 只是算出来的锚位悄悄不一致。被禁字面量从 anchor.rules.ts 自身
        # 派生 (检查器不写死), 且带探针自检 —— 抽取失配会报「已变平凡绿」而不是放行。
        # 出身: 原是 anchor.rules.spec.ts 尾部两个 it(), 按测试分类学 Small 档禁磁盘 I/O
        # + 治理检查归 scripts/checks/ 迁出。Full-scan, 不依赖 nx affected。
        run: pnpm tsx scripts/checks/check-optionsdesk-rule-constants.ts

      - name: Enforce env-config sync (per ADR-0037 § 2 + .claude/rules/config-env-sync.md)
        # lefthook check-env-sync 的云端镜像 (--no-verify / 不碰 trigger 文件的 commit
        # 绕不过这里)。CI 无 .env → pair-diff 自动跳过, 强制: process.env refs ⊆
        # .env.example ∪ ALLOWLIST (B) + boot-required key ∈ .env.production 或 secrets.enc.env (C)
        # 且已映射进 docker-compose.tight.yml (D, 防 029 chat-key / 2026-06-04 marketdata
        # tick 那类「值在 .env.production 但漏 compose 映射 → prod boot crash」)；明文
        # .env.production 无 secret 值 (F) + 非密 key ⊆ dev .env.example (G)。Full-scan,
        # 不依赖 nx affected — config 契约是 holistic invariant。
        run: pnpm tsx scripts/checks/check-env-sync.ts

      - name: Tooling self-tests (sdd-run + local-verify guard, 矩阵 T-6 收编)
        # 两个曾经的「孤儿套件」(不在 Nx / lefthook / CI 任何位置, 2026-08-03 T-6 判定后接线):
        #   · scripts/sdd-run/*.test.mjs —— /sdd-auto-impl 派单工具的 30 用例 (node:test, ~0.4s)
        #   · pretooluse-local-verify-guard.test.sh —— 本地验证 hook 的反例/正例对照表 (~1s);
        #     hook 拦截规则回归 = 开发体验事故 (误伤正常命令 / 放过必骗人命令), 值得 PR 门守。
        # 两者都不在 Nx graph 里 → 放本 job (治理全扫, 不依赖 affected)。
        run: |
          node --test scripts/sdd-run/*.test.mjs
          bash scripts/pretooluse-local-verify-guard.test.sh scripts/pretooluse-local-verify-guard.sh
          bash scripts/pretooluse-convention-rubric.test.sh scripts/pretooluse-convention-rubric.sh

      - name: Enforce convention reachability (orphan detection, per .claude/rules/convention-authoring.md)
        # docs/conventions/*.md 必须从 CLAUDE.md / .claude/** / 兄弟 convention / ops/**
        # / .specify/** 至少一处按文件名可达 —— 全仓无人指向的 convention 路由不到、
        # 等于不存在，且失联 100% 静默。referrer 面蓄意不含 plans/improvements（冻结
        # 历史不构成当下路由）。Full-scan, 不依赖 nx affected — 可达性是 holistic invariant。
        run: pnpm tsx scripts/checks/check-convention-orphan.ts

      - name: Enforce top-level layout ownership (per docs/conventions/repo-layout.md)
        # 顶层目录归属判据的机器强制，五条全 fail-closed（目标目录缺失 = 红，不是 skip）:
        #   1. ops/ 顶层 ⊆ {bin, host, jobs, lib, runbook}  ← 防 ops/ 再次沙化成一堆同类目录
        #   2. ops/runbook/ 下无可执行（它是纯文档目录）
        #   3. apps/* 必有 project.json;  4. services/* 必有 deploy/ 且不入 workspace glob
        #   5. ops/jobs/systemd 的 .timer/.service 成对 + ExecStart 目标映射回仓内必须存在
        # 第 5 条防**静默失效**: unit 指着仓里已不存在的脚本, systemd 不提前报错, 要等下次
        # OnCalendar 才 203/EXEC; 而多数探针 --on-success silent ⇒「装错了」与「探到真故障」
        # 在飞书上没法区分。它的运行期孪生是 ops/jobs/install.sh 的装机自检。
        # Full-scan, 不依赖 nx affected — 布局是 holistic invariant。
        run: pnpm tsx scripts/checks/check-repo-layout.ts

      - name: Enforce scheduled-task report mechanism (per .claude/rules/scheduled-tasks-registry.md)
        # 机器强制定时任务上报机制两条确定性 invariant:
        #   A. 飞书 wire-format (msg_type / open.feishu bot host) 只许在 ops/lib/feishu-send.sh
        #      —— 防「每加一个调度就重写 webhook/token/签名」(本次重构核心诉求);
        #   B. 每个 *.timer 单元 + 本地 launchd LABEL 登记进 ops/runbook/scheduled-tasks.md。
        # 判断类 (每日任务该不该套 nvy-run-reported / 加看门狗) 留 .claude/rules 引导, 不在此卡。
        # Full-scan, 不依赖 nx affected — 机制是 holistic invariant。lefthook 无对应本地 hook,
        # 本步是唯一硬门。
        run: pnpm tsx scripts/checks/check-scheduled-tasks.ts

      - name: Enforce no CJK var-fold in shell scripts (per #864 / #865)
        # 拦 `$NAME` 紧跟非 ASCII 字符（`echo "收到 $TIME）"`）—— CJK locale 下 bash 把该字符
        # 首字节折进变量名: 带 set -u 当场炸「未绑定的变量」并盖掉本该输出的诊断文案, 不带则
        # 静默丢值。**locale 相关而非 bash 版本相关** (zh_TW.UTF-8 + bash 5.3.9 必炸 /
        # en_US.UTF-8 + 5.2.21 正常) ⇒「我本机跑过没事」不构成证据, 脚本发给别人就炸。
        # bash -n 查不出; 只有走到那条错误路径才暴露 (happy path 永远碰不到) ⇒ 必须机器守。
        # 整行注释不算 (永不展开, 且仓内有蓄意展示该坏形态的说明注释)。Full-scan, 不依赖
        # nx affected。lefthook pre-commit 同名 hook 是本步的本地镜像 (--no-verify 绕不过本步)。
        run: pnpm tsx scripts/checks/check-cjk-var-fold.ts

      - name: Enforce identifier boundary (per docs/conventions/information-boundary.md)
        # 本仓面向公开 → 仓内只许出现代号；能定位到一台真机 / 一个云账号的字符串必须出仓
        # (运行时从 fleet.env 解析)。**gitleaks 覆盖不到这一层** —— 裸 IP / 云账号 UID /
        # 实例 ID 都没有熵特征, 内置规则集里没有对应 rule (per ADR-0037 §1)。
        # 🚨 本步是这条不变式的**唯一承重点**: 只挂 lefthook 的守门在 CI 上永远 skip
        #    (CI 无 ~/.nvy/fleet.env), 而 CI 才是唯一拦得住 PR 的路径; 本地钩子还结构性
        #    可被 `--no-verify` 绕过。本步跑的是 L1 结构层 —— 判形状, 不需要任何真值,
        #    所以在 CI / 新 clone 上同样有效。
        # 采集端 `git ls-files` 全集、**零 skip-dirs** (刻意反着 trivy-fs 的 skip-dirs: docs
        # 来 —— docs/ 正是所有基础设施标识符的所在地, 采集端一加 filter 反例就永远看不见)。
        # 过滤只在分析端: ops/host/identifier-allowlist.json 登记「已知良性」且**只按值、
        # 永不按路径** (按路径豁免是 gitleaks allowlist 那条教训的复现)。
        # Full-scan, 不依赖 nx affected。lefthook pre-commit / commit-msg 是本步的本地镜像。
        run: pnpm tsx scripts/checks/check-identifier-boundary.ts

      - name: Warn contract-smoke drift (echo-only, per 2026-06-22 #513/#530)
        # contract-smoke (apps/mobile/e2e/contract-smoke/*.contract.ts) 只在 nightly
        # e2e-real-backend.yml 跑、不在 PR CI (太慢, 归 nightly 兜底)。改 server 行为漏改对应
        # contract spec 断言 → drift 静默合进 main, 只在 nightly (软信号) 才红 (#513 marketdata
        # EP2 name / #530 ideation chips label 都是此类)。本步扫 branch diff (vs origin/main) 经
        # ::warning:: 注解提醒同步契约断言。**echo-only / 非阻断** (脚本恒 exit 0); 反复咬人可升级
        # hard-block。lefthook pre-push contract-smoke-drift 的云端镜像。需 fetch-depth: 0 (已设)。
        run: pnpm tsx scripts/checks/check-contract-smoke-drift.ts

  # ── 层 2：静态检查。比测试快得多，红得早。
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # nx affected --base=origin/main

      - uses: ./.github/actions/setup-workspace

      - name: Run Nx Affected (lint + typecheck)
        run: pnpm exec nx affected -t lint typecheck --base=origin/main

  # ── 层 3a：server 重任务。**与 mobile 分到不同 runner** 是本次拆分的核心目的。
  server-test:
    name: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # nx affected --base=origin/main

      - uses: ./.github/actions/setup-workspace

      - name: Run Nx Affected (server test + build + runtime-smoke)
        # 🚨 **只能用 `--exclude`，不能用 `--projects` / `-p`**。2026-08-02 用
        # `nx affected … --graph` 干跑实测：`nx affected -t test build runtime-smoke
        # --projects=server` 被**静默忽略**，任务图里照样含 mobile:build /
        # mobile:runtime-smoke / mobile:test —— 即 server 与 mobile 仍在同一 runner
        # 抢资源，本次拆分等于没做，且**不会有任何报错**。`--exclude=mobile` 则干净
        # （6 个任务，零 mobile）。改这行前先用 `--graph=<file>` 干跑核对任务集。
        run: pnpm exec nx affected -t test build runtime-smoke --exclude=mobile --base=origin/main

  # ── 层 3b：mobile 侧（Metro 打包 + logic-only 单测）。
  #
  # 2026-08-02 P4.3：**`mobile:runtime-smoke`（141 个 Playwright，CI 约 5.5min）已摘出 PR 门**，
  # 由 `nightly-sweep.yml` 的 `run-many -t … runtime-smoke --all` 兜底（它本来就在跑，
  # 摘出**不丢覆盖**，只是 UI 回归晚一天发现 —— 这是明确接受的代价）。
  # 连带效果：本 job 不再需要浏览器，Playwright 的下载 / 缓存 / 系统依赖三步全部消失，
  # 原先为它服务的 `cache-warm.yml` 也随之删除。
  #
  # ⚠️ **本地仍然跑** —— `.github/pull_request_template.md` 的物理验证命令仍含 `runtime-smoke`，
  # 本机整套只要约 30s（5.5min 是 4-vCPU runner 的数）。这个「本地比 CI 严」是**蓄意的**：
  # UI 回归在本机 30s 就能抓到，没必要占 PR 门 5.5 分钟外加与 server:test 抢资源。
  mobile-checks:
    name: mobile-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # nx affected --base=origin/main

      - uses: ./.github/actions/setup-workspace

      - name: Run Nx Affected (mobile test + build)
        # 只能 `--exclude`（`--projects` 会被静默忽略，见 server-test job 的注释）。
        # 排掉 server / @nvy/checks / types 后只剩 mobile 自身与它依赖的 api-client。
        run: pnpm exec nx affected -t test build --exclude=server,@nvy/checks,types --base=origin/main

  # ── 聚合门：ruleset 里那个唯一的 required context。
  validate-and-test:
    name: validate-and-test
    needs: [gate-checks, lint-typecheck, server-test, mobile-checks]
    # 上游红时 needs 里的 job 会变成 skipped，本 job 默认也会被跳过 —— 而**被跳过的
    # required check 在 GitHub 眼里不是失败**，PR 会显示可合并。故必须 always()。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate gate
        # 🚨 `skipped` / `cancelled` 必须与 `failure` 同等判红。只判 failure 是这类
        # 聚合门最经典的错法：上游一红，下游 job 变 skipped，门却放行 —— 一个红 PR
        # 显示全绿。（这与「CI 监控时 skipping 不算失败」正好相反：那说的是矩阵里
        # 本就该跳过的 job；这里的 skipped 恰恰意味着上游没跑成。）
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "分 job 结果: ${results}"
          case " ${results} " in
            *" failure "* | *" cancelled "* | *" skipped "*)
              echo "::error::有分 job 未成功（failure / cancelled / skipped）→ 门红"
              exit 1
              ;;
          esac
          echo "✅ 四个分 job 全部 success"
